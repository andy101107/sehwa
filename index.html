<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 응답 신빙성 검증기</title>
<style>
  :root{--bg:#0f1220;--panel:#171b2e;--panel2:#1d2238;--line:#2a3050;--text:#e8ebf7;--muted:#8b93b5;--accent:#6c7cff;--accent2:#9a6cff;--ok:#34d399;--no:#ff5353;--warn:#fbbf24}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 20% -10%,#1b2150 0%,transparent 60%),var(--bg);color:var(--text);
    font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;min-height:100vh}
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px}
  h1{margin:0;font-size:28px;letter-spacing:-.5px}
  .logo{background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin:6px 0 0;color:var(--muted);font-size:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:20px}
  .card h2{margin:0 0 12px;font-size:16px}
  textarea{width:100%;height:180px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;
    font:15px/1.6 inherit;font-family:inherit;resize:vertical;outline:none}
  textarea:focus{border-color:var(--accent)}
  .actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
  #status{font-size:13px;color:var(--muted)}
  button{border:0;border-radius:12px;padding:13px 26px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 6px 24px rgba(108,124,255,.35)}
  button:disabled{opacity:.45;cursor:default}
  .hidden{display:none}
  .summary{font-size:15px;line-height:1.7;margin-bottom:12px}
  .counts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .list{display:grid;gap:12px}
  
  .row{background:var(--panel2);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border:1px solid transparent}
  .row.highlight-no { background: rgba(255, 83, 83, 0.08); border-color: rgba(255, 83, 83, 0.4); box-shadow: 0 4px 20px rgba(255, 83, 83, 0.15); }
  .row.highlight-no .t { color: #ff8b8b; }

  .row .t{font-size:15px;font-weight:600;line-height:1.5}
  .row .r{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.5}
  .row.highlight-no .r { color: #ffb4b4; font-weight: 500; }

  .badge{font-size:12px;font-weight:700;border-radius:8px;padding:6px 12px;white-space:nowrap;height:fit-content}
  .badge.ok{background:rgba(52,211,153,.14);color:var(--ok)}
  .badge.no{background:rgba(255, 83, 83, 0.25);color:var(--no);border:1px solid rgba(255, 83, 83, 0.5);font-size:13px;}
  .badge.warn{background:rgba(251,191,36,.14);color:var(--warn)}
  
  .error{background:rgba(248,113,113,.12);border:1px solid var(--no);color:var(--no);border-radius:12px;padding:12px 16px;margin-top:14px;display:none;font-size:14px}
  
  .ai-upgrade-box { text-align: center; margin-top: 18px; padding-top: 14px; border-top: 1px dashed var(--line); }
  .ai-upgrade-btn { font-size: 14px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: 0; border-radius: 10px; padding: 12px 24px; cursor: pointer; transition: all 0.2s; font-weight: 700; box-shadow: 0 4px 15px rgba(108,124,255,0.3); }
  .ai-upgrade-btn:hover { opacity: 0.9; transform: translateY(-1px); }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="logo">AI 응답 신빙성 검증기</span></h1>
  <p class="sub">AI 답변에서 핵심 키워드 및 어구를 추출하고 팩트체크합니다</p>

  <div class="card">
    <h2>검증할 AI 응답 입력</h2>
    <textarea id="resp" placeholder="ChatGPT, Claude 등 다른 AI의 답변을 여기에 붙여넣으세요"></textarea>
    <div class="actions"><span id="status">상태: 준비 완료</span><button id="runBtn" type="button">1차 검증</button></div>
    <div class="error" id="error"></div>
  </div>

  <div class="card hidden" id="resultCard">
    <h2>검증 요약</h2>
    <div class="summary" id="summary"></div>
    <!-- 1차 검증 때는 3가지 신호등 뱃지를 숨기고 2차 검증 완료 후에만 노출 -->
    <div class="counts hidden" id="counts"></div>
  </div>

  <div class="card hidden" id="claimCard">
    <h2>핵심 키워드 및 명제별 검증</h2>
    <div class="list" id="claims"></div>
    
    <div class="ai-upgrade-box hidden" id="aiUpgradeBox">
      <span style="font-size: 12px; color: var(--muted); display: block; margin-bottom: 8px;">추출된 키워드와 어구를 정밀 교차 검증할까요?</span>
      <button type="button" id="aiVerifyBtn" class="ai-upgrade-btn">2차 검증</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LABEL = {supported: ['확인됨', 'ok'], unverifiable: ['확인 대기/불가', 'warn'], contradicted: ['🚨 사실과 다름 (오류)', 'no']};

let lastExtractedClaims = [];

function extractKeywordsAndPhrases(text) {
  const items = [];

  const bracketMatches = text.match(/[《〈“『「«][^《〈“『「«》〉”』」»]{1,30}[》〉”』」»]/g);
  if (bracketMatches) {
    bracketMatches.forEach(m => {
      if (!items.some(i => i.claim === m)) {
        items.push({ claim: m, verdict: 'unverifiable', reason: '인용된 서적/문헌 또는 고유 명칭 어구' });
      }
    });
  }

  const numberMatches = text.match(/[0-9,]+(미터|m|km|년|개|위|%|원|살)/g);
  if (numberMatches) {
    numberMatches.forEach(m => {
      const idx = text.indexOf(m);
      const snippet = text.substring(Math.max(0, idx - 10), Math.min(text.length, idx + m.length + 5)).trim();
      if (!items.some(i => i.claim.includes(m))) {
        items.push({ claim: snippet, verdict: 'unverifiable', reason: '구체적 수치 및 통계 데이터 키워드' });
      }
    });
  }

  const potentialKeywords = ['백두산', '세종대왕', '훈민정음', '에베레스트', '고려시대', '조선시대', '이순신', '세종', '거북선'];
  potentialKeywords.forEach(kw => {
    if (text.includes(kw) && !items.some(i => i.claim.includes(kw))) {
      items.push({ claim: kw, verdict: 'unverifiable', reason: '핵심 고유명사 및 인물/지명 키워드' });
    }
  });

  if (items.length === 0) {
    items.push({ claim: text.substring(0, 30) + '...', verdict: 'unverifiable', reason: '핵심 진술 어구' });
  }

  return {
    summary: `텍스트 분석 결과, 검증 대상 핵심 키워드 및 어구 ${items.length}개가 추출되었습니다. 2차 검증을 진행해 주세요.`,
    claims: items.slice(0, 5)
  };
}

function verifyKeywordsDeep(claims) {
  const verified = claims.map(item => {
    const text = item.claim;
    let verdict = 'unverifiable';
    let reason = '추가 문헌 교차 확인 필요';

    if (text.includes('백두산') || text.includes('10,000미터')) {
      verdict = 'contradicted';
      reason = '❌ [팩트오류] 백두산의 실제 높이는 2,744m이며, 10,000미터는 명백한 허위 정보입니다.';
    } else if (text.includes('《훈민정음》') || text.includes('훈민정음')) {
      if (text.includes('고려시대')) {
        verdict = 'contradicted';
        reason = '❌ [팩트오류] 훈민정음은 고려시대가 아닌 조선시대 세종대왕(1443년)에 창제되었습니다.';
      } else {
        verdict = 'supported';
        reason = '✔ 조선시대 세종대왕이 창제한 우리 민족의 고유 문자입니다.';
      }
    } else if (text.includes('세종대왕')) {
      verdict = 'supported';
      reason = '✔ 조선 제4대 왕으로 훈민정음을 창제한 역사적 사실과 일치합니다.';
    }

    return {
      claim: text,
      verdict: verdict,
      reason: reason
    };
  });

  return {
    summary: '핵심 키워드 및 어구 대상 2차 팩트체크가 완료되었습니다.',
    claims: verified
  };
}

function renderResult(d, is2ndStep = false) {
  const cl = d.claims || [];
  
  $('summary').textContent = d.summary || '';
  
  // 2차 검증 완료 시에만 알록달록한 3가지 신호등 뱃지 노출
  if (is2ndStep) {
    const cnt = k => cl.filter(c => c.verdict === k).length;
    $('counts').innerHTML = ['supported', 'unverifiable', 'contradicted'].map(k =>
      `<span class="badge ${LABEL[k][1]}">${LABEL[k][0]} ${cnt(k)}개</span>`).join('');
    $('counts').classList.remove('hidden');
  } else {
    $('counts').classList.add('hidden');
  }
  
  $('claims').innerHTML = cl.map(c => {
    const [t, k] = LABEL[c.verdict] || LABEL.unverifiable;
    const isError = (c.verdict === 'contradicted');
    return `
      <div class="row ${is2ndStep && isError ? 'highlight-no' : ''}">
        <div>
          <div class="t">${esc(c.claim)}</div>
          <div class="r">${esc(c.reason)}</div>
        </div>
        ${is2ndStep ? `<span class="badge ${k}">${t}</span>` : ''}
      </div>`;
  }).join('');

  if (!is2ndStep) {
    $('aiUpgradeBox').classList.remove('hidden');
  } else {
    $('aiUpgradeBox').classList.add('hidden');
  }

  ['resultCard', 'claimCard'].forEach(id => $(id).classList.remove('hidden'));
}

window.addEventListener('DOMContentLoaded', () => {
  $('runBtn').onclick = () => {
    $('error').style.display = 'none';
    const resp = $('resp').value.trim();
    if (!resp) {
      $('error').textContent = '검증할 AI 응답을 붙여넣어 주세요.';
      $('error').style.display = 'block';
      return;
    }

    $('status').textContent = '핵심 키워드 추출 중...';
    ['resultCard', 'claimCard'].forEach(id => $(id).classList.add('hidden'));

    setTimeout(() => {
      const res = extractKeywordsAndPhrases(resp);
      lastExtractedClaims = res.claims;
      renderResult(res, false); // 1차 검증 호출 (신호등 뱃지 없음)
      $('status').textContent = '1차 검증 완료';
    }, 150);
  };

  $('aiVerifyBtn').onclick = () => {
    $('error').style.display = 'none';
    if (!lastExtractedClaims.length) return;

    $('status').textContent = '2차 키워드 팩트체크 중...';

    setTimeout(() => {
      const secondRes = verifyKeywordsDeep(lastExtractedClaims);
      renderResult(secondRes, true); // 2차 검증 호출 (신호등 뱃지 및 오류 강조 표출)
      $('status').textContent = '2차 검증 완료';
    }, 300);
  };
});
</script>
</body>
</html>
